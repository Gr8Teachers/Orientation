<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orientation Quizzes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7ef;--accent:#1b2f6b;--soft:#eaeef8}
@media (prefers-color-scheme:dark){:root{--bg:#11151d;--ink:#e6eaf2;--muted:#9aa3b5;--line:#2a3242;--accent:#6b9bff;--soft:#1a2440}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0}
h1{margin:0;font-size:1.7rem}
p{margin:0;color:var(--muted)}
ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border:2px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:700}
a:hover,a:focus-visible{border-color:var(--accent);background:var(--soft);outline:none}
a span{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">AMEP / SEE / ESOL</p>
  <h1>Orientation quizzes</h1>
  <p>Choose your campus.</p>
  <ul>
    <li><a href="St_Leonards/">St Leonards <span>Start →</span></a></li>
  </ul>
</div>
</body>
</html>
